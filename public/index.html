<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEXO Rondas</title>
    <link rel="stylesheet" href="css/index.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body>
    <div class="app-wrapper container">
        
        <!-- Login View -->
        <main id="view-login" class="view active login-container glass-surface">
            <div class="brand-logo">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                </svg>
                <div class="brand-title">NEXO Rondas</div>
            </div>
            
            <h2 class="text-center">Iniciar Sesión</h2>
            <p class="text-center">Ingresa tus credenciales para acceder</p>
            
            <form id="login-form">
                <div class="form-group">
                    <label for="rut" class="form-label">RUT</label>
                    <input type="text" id="rut" class="form-control" placeholder="12345678-9" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary btn-block">
                    Acceder
                </button>
            </form>
        </main>

        <!-- Dashboard View (Supervisor/Admin) -->
        <main id="view-dashboard" class="view">
            <header class="dashboard-header glass-surface mb-4" style="display: flex; justify-content: space-between; align-items: center; padding: var(--space-4) var(--space-6);">
                <div>
                    <h1>Panel de Control</h1>
                    <p style="margin:0;">Bienvenido, <span id="user-name">Usuario</span></p>
                </div>
                <button id="btn-logout" class="btn btn-primary">Cerrar Sesión</button>
            </header>

            <div class="glass-surface">
                <h2>Gestión de Instalaciones</h2>
                
                <div class="form-group">
                    <button id="btn-new-facility" class="btn btn-primary mb-4">+ Nueva Instalación</button>
                </div>

                <div id="facilities-list">
                    <p>Cargando instalaciones...</p>
                </div>

                <hr style="margin: var(--space-6) 0; border: 0; border-top: 1px solid var(--surface-border);">

                <h2>Puntos de Control (QR)</h2>
                <div class="form-group">
                    <label for="select-facility" class="form-label">Seleccionar Instalación:</label>
                    <select id="select-facility" class="form-control mb-4">
                        <option value="">Seleccione...</option>
                    </select>
                    <button id="btn-new-checkpoint" class="btn btn-primary mb-4 hidden">+ Nuevo Punto de Control</button>
                </div>

                <div id="checkpoints-list" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: var(--space-4);">
                    <p>Selecciona una instalación para ver sus puntos.</p>
                </div>
            </div>
        </main>

        <!-- Guard App View -->
        <main id="view-guard" class="view">
            <div class="glass-surface">
                <h1>Mis Rondas</h1>
                <p>Escaneo estricto activado.</p>
                <!-- UI for QR scanner will go here -->
                <button id="btn-logout-guard" class="btn btn-primary">Cerrar Sesión</button>
            </div>
        </main>

    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/admin.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
